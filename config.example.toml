# NetShare Hub bootstrap settings.
# Only the values the server needs before it can open its database live here.
# Everything else is edited in the web UI.
# Every key can also be set with an environment variable (shown on the right).

listen = "0.0.0.0:8080"              # NSH_LISTEN
data_dir = "/var/lib/netshare-hub"   # NSH_DATA_DIR
log_level = "info"                   # NSH_LOG_LEVEL   debug | info | warn | error
log_format = "json"                  # NSH_LOG_FORMAT  json | text
secure_cookies = true                # NSH_SECURE_COOKIES  keep true behind HTTPS

# How the server reaches the operating system (NSH_SYS):
#   "agent"  recommended. The web server runs as an unprivileged user and asks
#            the root agent (`netshare-hub agent`, same config file) over a
#            local socket. Start the agent first.
#   "real"   everything in one process, which must then run as root.
#   "fake"   development only: nothing on the system is touched.
sys = "agent"
agent_socket = "/run/netshare-hub/agent.sock"   # NSH_AGENT_SOCKET
agent_user = "netshare"                         # NSH_AGENT_USER  the user the web server runs as

# The largest file the web file manager accepts in one upload, in bytes.
# 0 = no limit (the disk is the limit).
max_upload_bytes = 0
